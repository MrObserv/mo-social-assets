<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="32" height="32">
  <style>
    .ring { stroke: #0d7377; }
    .disc { fill: #0f2b2d; }
    .tick { stroke: #64ffda; }
    .eye { fill: #ffffff; }
    .iris { fill: #0a5c5e; }
    .pupil { fill: #2dd4bf; }

    @media (prefers-color-scheme: light) {
      .ring { stroke: #0a5c5e; }
      .disc { fill: #0f3d3f; }
      .tick { stroke: #0d7377; }
      .eye { fill: #ffffff; }
      .iris { fill: #0a5c5e; }
      .pupil { fill: #2dd4bf; }
    }
  </style>

  <!-- Outer ring — heavier stroke for small size -->
  <circle class="ring" cx="100" cy="100" r="86" fill="none" stroke-width="10"/>
  <!-- Inner disc -->
  <circle class="disc" cx="100" cy="100" r="62"/>

  <!-- Crosshair ticks — proportionally larger -->
  <g class="tick" stroke-width="9" stroke-linecap="round">
    <line x1="100" y1="0" x2="100" y2="24"/>
    <line x1="100" y1="176" x2="100" y2="200"/>
    <line x1="0" y1="100" x2="24" y2="100"/>
    <line x1="176" y1="100" x2="200" y2="100"/>
  </g>

  <!-- Eye — simplified, bolder -->
  <path class="eye" d="M38 100 Q100 54 162 100 Q100 146 38 100 Z"/>
  <!-- Iris -->
  <circle class="iris" cx="100" cy="100" r="26"/>
  <!-- Pupil -->
  <circle class="pupil" cx="100" cy="100" r="16"/>
</svg>
