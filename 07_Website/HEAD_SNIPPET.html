<!-- Mastering Observability — site icons.
     Paste into <head>. Paths assume favicon.ico and site.webmanifest at the
     web root and the ring_mark folder served at /brand/ring_mark/.

     theme_color and background_color are #17695C (light.teal-deep) and
     #F6F8F7 (light.ground) — both read from design-tokens.json 3.2.2, not
     chosen here. If they ever disagree with the token file, the token file
     wins.

     Do NOT add a <link rel="icon" href="/favicon.svg"> line. The SVG favicon
     in this estate was the retired eye mark; it was deleted 2026-09-17. -->
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<link rel="icon" type="image/png" sizes="32x32" href="/brand/ring_mark/mo_ring_mark_favicon_32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/brand/ring_mark/mo_ring_mark_favicon_180.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#17695C">
